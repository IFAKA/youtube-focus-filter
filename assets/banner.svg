<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#grid)"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="200" cy="500" r="300" fill="#8B5CF6" opacity="0.1"/>
  <circle cx="1100" cy="150" r="250" fill="#EC4899" opacity="0.08"/>

  <!-- YouTube-style blocked thumbnails -->
  <g transform="translate(140, 280)">
    <rect width="160" height="90" rx="8" fill="#282828"/>
    <rect x="5" y="95" width="100" height="10" rx="2" fill="#404040"/>
    <rect x="5" y="110" width="60" height="8" rx="2" fill="#303030"/>
    <line x1="20" y1="20" x2="140" y2="70" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
    <line x1="140" y1="20" x2="20" y2="70" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  </g>

  <g transform="translate(140, 420)">
    <rect width="160" height="90" rx="8" fill="#282828"/>
    <rect x="5" y="95" width="120" height="10" rx="2" fill="#404040"/>
    <rect x="5" y="110" width="80" height="8" rx="2" fill="#303030"/>
    <line x1="20" y1="20" x2="140" y2="70" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
    <line x1="140" y1="20" x2="20" y2="70" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Allowed thumbnails -->
  <g transform="translate(980, 280)">
    <rect width="160" height="90" rx="8" fill="#8B5CF6" opacity="0.3"/>
    <rect x="5" y="95" width="100" height="10" rx="2" fill="#404040"/>
    <rect x="5" y="110" width="60" height="8" rx="2" fill="#303030"/>
    <circle cx="140" cy="75" r="12" fill="#22c55e"/>
    <path d="M134 75 L138 79 L146 71" stroke="white" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(980, 420)">
    <rect width="160" height="90" rx="8" fill="#8B5CF6" opacity="0.3"/>
    <rect x="5" y="95" width="120" height="10" rx="2" fill="#404040"/>
    <rect x="5" y="110" width="80" height="8" rx="2" fill="#303030"/>
    <circle cx="140" cy="75" r="12" fill="#22c55e"/>
    <path d="M134 75 L138 79 L146 71" stroke="white" stroke-width="2" fill="none"/>
  </g>

  <!-- Center content -->
  <g transform="translate(640, 280)">
    <!-- Brain/AI icon -->
    <circle cx="0" cy="0" r="60" fill="url(#accent)" opacity="0.2"/>
    <circle cx="0" cy="0" r="45" fill="url(#accent)" opacity="0.3"/>
    <text x="0" y="15" text-anchor="middle" font-size="50" fill="white">🧠</text>
  </g>

  <!-- Title -->
  <text x="640" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white">YouTube Focus Filter</text>

  <!-- Subtitle -->
  <text x="640" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0a0a0">Local LLM filters your feed. Keep focus. Block distractions.</text>

  <!-- Tech badges -->
  <g transform="translate(640, 500)">
    <rect x="-180" y="0" width="100" height="28" rx="14" fill="#8B5CF6" opacity="0.3"/>
    <text x="-130" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">Ollama</text>

    <rect x="-60" y="0" width="120" height="28" rx="14" fill="#8B5CF6" opacity="0.3"/>
    <text x="0" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">Manifest V3</text>

    <rect x="80" y="0" width="100" height="28" rx="14" fill="#8B5CF6" opacity="0.3"/>
    <text x="130" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">100% Local</text>
  </g>

  <!-- Arrows showing flow -->
  <path d="M320 350 Q450 320 520 320" stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M760 320 Q830 320 960 350" stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
